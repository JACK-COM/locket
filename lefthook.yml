# Copies of panoply-lib files are generated: a hand edit to one fails here.
pre-commit:
  commands:
    panoply-lib:
      run: ../panoply-lib/sync.sh --check locket
    selftest:
      run: python3 src/locket/memscan.py selftest && python3 src/locket/locket.py selftest && python3 src/locket/locket_mcp.py --selftest
