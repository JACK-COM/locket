[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "locket"
dynamic = ["version"]
description = "Keeps an AI agent's memory from holding the same fact twice."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
onnx = ["onnxruntime", "tokenizers"]

[project.scripts]
locket = "locket.locket:cli"

[project.urls]
Homepage = "https://github.com/JACK-COM/locket"

[tool.setuptools.dynamic]
version = {attr = "locket.locket.__version__"}

[tool.setuptools.package-data]
locket = ["INSTALL-locket.md"]

[tool.mypy]
# `make typecheck`. The scripts import their siblings bare, so the package directory is
# the import root; the underscore modules are panoply-lib copies, checked in panoply-lib.
python_version = "3.9"
files = ["src/locket"]
exclude = ['^src/locket/_[a-z]']
mypy_path = "src/locket"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["_embed", "_settings", "_manifest_schema"]
follow_imports = "skip"

# Modules whose every function is annotated; a module joins once it is.
[[tool.mypy.overrides]]
module = ["fsio", "paths", "hosts", "manifest", "trust", "corpora"]
disallow_untyped_defs = true
